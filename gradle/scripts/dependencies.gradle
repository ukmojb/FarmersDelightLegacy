apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "CleanroomMC"
        url = uri("https://maven.cleanroommc.com")
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven { url 'https://jitpack.io' }
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    implementation rfg.deobf('mezz:jei:4.31.2')

    //稻米(含水方块)
    compileOnly rfg.deobf("curse.maven:fluidlogged-api-485654:7581579")

    //樱花树
    compileOnly rfg.deobf("curse.maven:Cherry_on_1.12.2-1122982:7760834")

    //樱花树
    compileOnly rfg.deobf("curse.maven:sakura-reforged-1461245:7883662")
    compileOnly rfg.deobf("curse.maven:mysterious-mountain-lib-368098:3254750")

    //下界更新移植
    compileOnly rfg.deobf("curse.maven:unseens-nether-backport-1109447:7694245")
    compileOnly rfg.deobf("curse.maven:nether-api-1306115:7216794")

    //未来的 MC
    compileOnly rfg.deobf("curse.maven:future-mc-310059:6162819")
    testImplementation rfg.deobf("curse.maven:future-mc-310059:6162819")
    testRuntimeOnly 'com.teamwizardry.librarianlib:LibrarianLib-Continuous:4.22-2.0'

    // Farmer's Future Delight
    implementation rfg.deobf(files('libs/farmers-future-delight-1.6.0.jar'))

    //营火
    compileOnly rfg.deobf("curse.maven:campfire-719464:4533381")

    //掠夺者
    compileOnly rfg.deobf("curse.maven:raids-backport-977633:7890943")
    compileOnly rfg.deobf("curse.maven:atlas-lib-463826:7845224")

    //村庄建筑更新
    compileOnly rfg.deobf("curse.maven:village-names-259230:5886882")
    testImplementation rfg.deobf("curse.maven:village-names-259230:5886882")

    //海洋更新
    compileOnly rfg.deobf("curse.maven:Oceanic Expanse-840576:7009970")

    //流浪商人联动
    compileOnly rfg.deobf("curse.maven:Wandering Traders Backport-1257940:7743810")

    //燐/Hesperus
    compileOnly rfg.deobf("curse.maven:Hesperus-620262:4724647")

    //Nyx
    compileOnly rfg.deobf("curse.maven:Nyx-349214:3161738")

    //crt
    implementation rfg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.698')

    //林业 与 Binnie
    runtimeOnly rfg.deobf('curse.maven:forestry-59751:2918418')
    runtimeOnly rfg.deobf('curse.maven:binnies-mods-patched-899182:5492997')

    //懒人厨房
    runtimeOnly rfg.deobf('curse.maven:cooking-for-blockheads-231484:2862651')
//    runtimeOnly rfg.deobf('curse.maven:delightful-cuisine-for-woodheads-805622:6997581')
    runtimeOnly rfg.deobf('curse.maven:lemonskin-1337144:7763338')
    compileOnly rfg.deobf('curse.maven:lemonskin-1337144:7763338')
    runtimeOnly rfg.deobf('curse.maven:harvest-festival-legacy-342649:8191153')

    compileOnly rfg.deobf('curse.maven:serene-seasons-291874:2799213')
    compileOnly rfg.deobf('curse.maven:immersive-engineering-231951:2974106')
    testImplementation rfg.deobf('curse.maven:tinkers-construct-74072:2902483')
    testImplementation rfg.deobf('curse.maven:mantle-74924:2713386')

    //Quark
    compileOnly rfg.deobf('curse.maven:Quark-243121:2924091')
    compileOnly rfg.deobf('curse.maven:AutoRegLib-250363:2746011')

    //苍白花园
    compileOnly rfg.deobf('curse.maven:Pale Bloom-1375465:7169494')
    compileOnly rfg.deobf('software.bernie.geckolib:forge-1.12.2-geckolib:3.0.21')

    //EditableEdibles(纯纯的抽象模组)
//    implementation rfg.deobf('curse.maven:EditableEdibles-1052472:6808042')
//    implementation rfg.deobf('curse.maven:FermiumBooterDepoliticization-1163720:7668886')
//    implementation rfg.deobf('com.cleanroommc:configanytime:3.0')

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
//    implementation rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // embed = bundle dependencies into final output artifact (no relocation)

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}
